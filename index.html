<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الخائن بيننا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0505; --bg2:#160707; --red:#c8102e; --red-dim:#7a0d1c; --red-glow:#ff2d42;
  --ink:#f2e6e6; --ink-dim:#c9a9a9; --gold:#caa24a; --card:#170a0a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:'Cairo',system-ui,sans-serif; overflow-x:hidden; position:relative;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(200,16,46,.25), transparent 55%),
    radial-gradient(ellipse at 50% 110%, rgba(120,0,10,.3), transparent 60%);
  animation:fog 8s ease-in-out infinite alternate;
}
@keyframes fog{0%{opacity:.7}100%{opacity:1}}
#app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 18px 36px;}
.screen{width:100%; max-width:460px; display:flex; flex-direction:column; align-items:center; gap:16px; animation:rise .5s ease both;}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)}}
h1.logo{font-size:2.1rem; font-weight:900; color:var(--red-glow); text-align:center; margin:0 0 4px;
  text-shadow:0 0 10px rgba(255,45,66,.7), 0 0 26px rgba(255,45,66,.4); letter-spacing:1px;}
h2{font-size:1.35rem; font-weight:800; margin:0; text-align:center; color:var(--ink);}
p.sub{color:var(--ink-dim); text-align:center; line-height:1.9; font-size:.98rem; margin:0;}
.card{background:linear-gradient(160deg,var(--card),#0d0404); border:1px solid var(--red-dim); border-radius:16px; padding:18px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.5);}
.btn{
  appearance:none; border:none; cursor:pointer; width:100%; padding:15px 18px; border-radius:12px;
  font-family:inherit; font-weight:800; font-size:1.02rem; color:#fff;
  background:linear-gradient(135deg,var(--red),#7a0d1c); box-shadow:0 6px 18px rgba(200,16,46,.4);
  transition:transform .12s ease, box-shadow .12s ease; touch-action:manipulation;
}
.btn:active{transform:scale(.97); box-shadow:0 3px 10px rgba(200,16,46,.35);}
.btn.ghost{background:transparent; border:1.5px solid var(--red-dim); color:var(--ink-dim); box-shadow:none;}
.btn.gold{background:linear-gradient(135deg,var(--gold),#8a6a1e); color:#1a0f00;}
.btn:disabled{opacity:.4; pointer-events:none;}
.rules{width:100%; display:flex; flex-direction:column; gap:10px;}
.rule-item{display:flex; gap:10px; align-items:flex-start; background:#150808; border:1px solid #2a1010; border-radius:12px; padding:12px 14px;}
.rule-item .ic{font-size:1.3rem; line-height:1;}
.rule-item .tx{font-size:.92rem; color:var(--ink-dim); line-height:1.7;}
.rule-item b{color:var(--ink);}
.namebox{display:flex; gap:8px; width:100%;}
input[type=text]{
  flex:1; padding:14px; border-radius:12px; border:1.5px solid var(--red-dim); background:#120707;
  color:var(--ink); font-family:inherit; font-size:1rem;
}
input[type=text]:focus{outline:2px solid var(--red-glow);}
.namelist{width:100%; display:flex; flex-direction:column; gap:8px; max-height:38vh; overflow-y:auto;}
.name-row{display:flex; align-items:center; justify-content:space-between; background:#140808; border:1px solid #2a1010; border-radius:10px; padding:10px 14px;}
.name-row span{font-weight:700;}
.rm{background:none; border:none; color:#ff6b6b; font-size:1.1rem; cursor:pointer; padding:4px 8px;}
.count-warn{color:var(--gold); font-size:.85rem; text-align:center;}
.reveal-gate{width:100%; text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center;}
.reveal-gate .who{font-size:1.5rem; font-weight:900; color:var(--gold);}
.reveal-card{width:100%; background:radial-gradient(circle at 50% 0%,#2a0808,#0d0303); border:2px solid var(--red); border-radius:18px; padding:26px 20px; text-align:center; animation:pop .4s ease;}
@keyframes pop{from{transform:scale(.85); opacity:0} to{transform:scale(1); opacity:1}}
.role-name{font-size:2rem; font-weight:900; color:var(--red-glow); text-shadow:0 0 14px rgba(255,45,66,.6); margin:6px 0;}
.role-ic{font-size:2.6rem;}
.role-desc{color:var(--ink-dim); font-size:.95rem; line-height:1.8; margin-top:8px;}
.progress{font-size:.85rem; color:var(--ink-dim);}
.pick-list{width:100%; display:flex; flex-direction:column; gap:8px; max-height:44vh; overflow-y:auto;}
.pick-item{
  padding:14px; border-radius:12px; border:1.5px solid #2a1010; background:#140808; text-align:center;
  font-weight:700; cursor:pointer; transition:.15s;
}
.pick-item.sel{border-color:var(--red-glow); background:linear-gradient(135deg,#3a0a0f,#1a0505); box-shadow:0 0 14px rgba(255,45,66,.35);}
.pick-item.skip{border-style:dashed; color:var(--ink-dim);}
.timer{font-size:3.2rem; font-weight:900; color:var(--red-glow); text-shadow:0 0 20px rgba(255,45,66,.6); letter-spacing:2px;}
.kill-screen{position:fixed; inset:0; z-index:50; background:#050101; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:20px;}
.kill-screen.flash{animation:pulseRed 1.1s ease-in-out infinite;}
@keyframes pulseRed{0%,100%{background:#050101}50%{background:#4a0006}}
.drip{position:absolute; top:0; width:3px; background:linear-gradient(#8c0016,#3a0009); border-radius:0 0 3px 3px; animation:drip linear infinite;}
@keyframes drip{0%{height:0; opacity:1}90%{opacity:1}100%{height:70vh; opacity:0}}
.skull{font-size:4rem; animation:shake 1.4s ease-in-out infinite;}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
.glitch{font-size:2.1rem; font-weight:900; color:#fff; text-shadow:2px 0 #ff2d42,-2px 0 #00e0ff; animation:glitch 2.2s infinite;}
@keyframes glitch{0%,90%,100%{transform:translate(0)}92%{transform:translate(-2px,1px)}94%{transform:translate(2px,-1px)}96%{transform:translate(-1px,-1px)}}
.imp-reveal{position:fixed; inset:0; z-index:60; background:radial-gradient(circle at 50% 40%,#5a0008,#050101 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:20px; animation:pulseRed .9s ease-in-out infinite;}
.imp-eye{font-size:4.2rem; animation:eyepulse 1.2s ease-in-out infinite;}
@keyframes eyepulse{0%,100%{transform:scale(1); filter:drop-shadow(0 0 6px #ff2d42)}50%{transform:scale(1.15); filter:drop-shadow(0 0 22px #ff2d42)}}
.imp-title{font-size:2.4rem; font-weight:900; color:#ff2d42; text-shadow:0 0 24px rgba(255,45,66,.9); animation:shake .5s ease-in-out infinite;}
.result-badge{padding:6px 16px; border-radius:20px; font-weight:800; font-size:.9rem; display:inline-block;}
.badge-peace{background:#1f2f1f; color:#7fd97f; border:1px solid #2f5a2f;}
.badge-traitor{background:#3a0a0a; color:#ff8a8a; border:1px solid #7a1f1f;}
.roster{width:100%; display:flex; flex-direction:column; gap:8px;}
.roster-row{display:flex; justify-content:space-between; align-items:center; background:#140808; border:1px solid #2a1010; border-radius:10px; padding:10px 14px;}
.roster-row.dead{opacity:.5; text-decoration:line-through;}
.role-tag{font-size:.8rem; padding:3px 10px; border-radius:12px; font-weight:700;}
.tag-impostor{background:#3a0a0a; color:#ff6b6b;}
.tag-citizen{background:#1a1a1a; color:#bbb;}
.tag-doctor{background:#0f2a1a; color:#7fd97f;}
.tag-detective{background:#2a230a; color:#e0c060;}
.winner-banner{font-size:1.6rem; font-weight:900; text-align:center; padding:14px; border-radius:14px; width:100%;}
.win-citizens{background:#0f2a1a; color:#7fd97f; box-shadow:0 0 20px rgba(127,217,127,.25);}
.win-impostor{background:#3a0a0a; color:#ff6b6b; box-shadow:0 0 20px rgba(255,45,66,.3);}
@media (max-width:360px){.timer{font-size:2.6rem} .role-name{font-size:1.6rem} h1.logo{font-size:1.8rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app = document.getElementById('app');
const ROLE_INFO = {
  'مواطن': {ic:'🕯️', desc:'أنت مواطن عادي. لا تملك أي قدرات خاصة، مهمتك أن تراقب وتناقش وتكتشف من هو الامبوستر قبل أن يفتك بالجميع.'},
  'شايب': {ic:'🔍', desc:'أنت الشايب. في كل جولة تختار شخصاً لتحقق معه، وسيظهر لك إن كان "خائناً" أو "مسالماً". استخدم معلوماتك بذكاء دون أن تفضح نفسك.'},
  'طبيب': {ic:'💉', desc:'أنت الطبيب. في كل جولة تختار شخصاً لتحميه من الموت الليلة القادمة. لا يمكنك حماية نفس الشخص جولتين متتاليتين.'},
  'امبوستر': {ic:'🗡️', desc:'أنت الامبوستر! اختر ضحية كل ليلة سراً. تفوز عندما يتبقى في اللعبة أنت ولاعب واحد فقط دون أن يُكشف أمرك.'}
};
let S = {};
function freshState(){
  return {screen:'welcome', players:[], round:1, killsNeeded:0,
    nightKillTarget:null, nightProtectTarget:null, lastProtected:null, nightQueue:[], nightQueueIdx:0,
    detectiveTargetId:null, detectiveResult:null, victimId:null, savedByDoctor:false,
    revealIdx:0, timerSec:180, timerHandle:null,
    voters:[], voteIdx:0, votes:{}, skipVotes:0, eliminatedId:null, eliminatedWasImpostor:false, winner:null};
}
S = freshState();
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function alive(){return S.players.filter(p=>p.alive);}
function byId(id){return S.players.find(p=>p.id===id);}
function render(){
  app.innerHTML='';
  const fns={welcome:screenWelcome, explain:screenExplain, names:screenNames, revealGate:screenRevealGate, revealCard:screenRevealCard,
    nightGate:screenNightGate, nightCitizen:screenNightCitizen, nightImpostorPick:screenNightImpostorPick, nightDoctorPick:screenNightDoctorPick,
    nightDetectivePick:screenNightDetectivePick, detectiveResult:screenDetectiveResult,
    victim:screenVictim, discuss:screenDiscuss, voteGate:screenVoteGate, votePick:screenVotePick, voteResult:screenVoteResult, impReveal:screenImpReveal, gameOver:screenGameOver};
  (fns[S.screen]||screenWelcome)();
}
function el(tag,cls,html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e;}
function mkScreen(){const s=el('div','screen'); app.appendChild(s); return s;}
function btn(text,cls,onClick){const b=el('button','btn '+(cls||''),text); b.onclick=onClick; return b;}

function screenWelcome(){
  const s=mkScreen();
  s.appendChild(el('div','','<div style="font-size:3.4rem;text-align:center">🎭</div>'));
  s.appendChild(el('h1','logo','الخائن بيننا'));
  s.appendChild(el('p','sub','في هذه القرية المظلمة... يختبئ خائن بين الجميع.<br>هل ستكشفونه قبل فوات الأوان؟'));
  s.appendChild(btn('ابدأ اللعبة','',()=>{S.screen='explain'; render();}));
}
function screenExplain(){
  const s=mkScreen();
  s.appendChild(el('h2','','كيف تُلعب؟'));
  const rules=[
    ['👥','<b>5 لاعبين على الأقل.</b> لكل زيادة عن 5 يُضاف مواطن إضافي تلقائياً.'],
    ['🔍','<b>الشايب</b> يحقق كل جولة مع شخص ليعرف إن كان خائناً أو مسالماً.'],
    ['💉','<b>الطبيب</b> يحمي شخصاً كل ليلة، ولا يحمي نفس الشخص جولتين متتاليتين.'],
    ['🗡️','<b>الامبوستر</b> يختار ضحية كل ليلة سراً ليقتلها.'],
    ['🕯️','<b>المواطنون</b> ليس لديهم قدرات، فقط نقاش وتصويت.'],
    ['🗳️','بعد نقاش 3 دقائق، الجميع يصوّتون على المشتبه به أو "تخطي".'],
    ['⚖️','من يُطرد يُكشف فقط إن كان الامبوستر — غيره يبقى "مسالم" دون كشف دوره.'],
    ['🏆','يفوز الشعب بطرد الامبوستر. يفوز الامبوستر إذا بقي مع لاعب واحد فقط.']
  ];
  const box=el('div','rules');
  rules.forEach(r=>{const it=el('div','rule-item'); it.innerHTML=`<div class="ic">${r[0]}</div><div class="tx">${r[1]}</div>`; box.appendChild(it);});
  s.appendChild(box);
  s.appendChild(btn('فهمت، لنكتب الأسماء','',()=>{S.screen='names'; render();}));
}
function screenNames(){
  const s=mkScreen();
  s.appendChild(el('h2','','من سيلعب؟'));
  s.appendChild(el('p','sub','أدخلوا أسماءكم واحداً تلو الآخر'));
  const box=el('div','namebox');
  const inp=document.createElement('input'); inp.type='text'; inp.placeholder='اكتب اسمك هنا...'; inp.maxLength=18;
  const add=()=>{const v=inp.value.trim(); if(!v) return; S.players.push({id:crypto.randomUUID(), name:v, role:null, alive:true}); inp.value=''; render(); const ni=app.querySelector('input[type=text]'); if(ni) ni.focus();};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); add();}});
  box.appendChild(inp);
  const addBtn=document.createElement('button');
  addBtn.className='btn'; addBtn.style.width='56px'; addBtn.style.padding='0'; addBtn.textContent='+'; addBtn.onclick=add;
  box.appendChild(addBtn);
  s.appendChild(box);
  const list=el('div','namelist');
  S.players.forEach((p,i)=>{
    const row=el('div','name-row');
    row.innerHTML=`<span>${i+1}. ${p.name}</span>`;
    const rm=el('button','rm','✕'); rm.onclick=()=>{S.players.splice(i,1); render();};
    row.appendChild(rm); list.appendChild(row);
  });
  s.appendChild(list);
  if(S.players.length<5) s.appendChild(el('div','count-warn',`تحتاجون ${5-S.players.length} لاعباً إضافياً على الأقل`));
  const startBtn=btn('توزيع الأدوار 🎲','',startGame);
  if(S.players.length<5) startBtn.disabled=true;
  s.appendChild(startBtn);
  setTimeout(()=>{const i=app.querySelector('input[type=text]'); if(i) i.focus();},50);
}
function startGame(){
  const n=S.players.length;
  const citizensCount=2+(n-5);
  const roles=['شايب','طبيب','امبوستر'];
  for(let i=0;i<citizensCount;i++) roles.push('مواطن');
  shuffle(roles);
  shuffle(S.players);
  S.players.forEach((p,i)=>p.role=roles[i]);
  S.killsNeeded=n-2;
  S.revealIdx=0;
  S.screen='revealGate';
  render();
}
function screenRevealGate(){
  const p=S.players[S.revealIdx];
  const s=mkScreen();
  s.appendChild(el('div','','<div style="font-size:2.6rem;text-align:center">📱</div>'));
  s.appendChild(el('p','sub','مرّروا الجوال إلى'));
  const g=el('div','reveal-gate');
  g.appendChild(el('div','who',p.name));
  g.appendChild(el('p','sub','تأكد أن أحداً غيرك لا ينظر إلى الشاشة'));
  g.appendChild(btn('اضغط لتكشف دورك','',()=>{S.screen='revealCard'; render();}));
  s.appendChild(g);
}
function screenRevealCard(){
  const p=S.players[S.revealIdx];
  const info=ROLE_INFO[p.role];
  const s=mkScreen();
  const c=el('div','reveal-card');
  c.innerHTML=`<div class="role-ic">${info.ic}</div><div class="role-name">${p.role}</div><div class="role-desc">${info.desc.replace('[N]',S.killsNeeded)}</div>`;
  s.appendChild(c);
  s.appendChild(el('div','progress',`${S.revealIdx+1} / ${S.players.length}`));
  s.appendChild(btn('أخفِ وسلّم للتالي','',()=>{
    S.revealIdx++;
    if(S.revealIdx>=S.players.length){ startNightPhase(); }
    else S.screen='revealGate';
    render();
  }));
}
function passGate(title,who,onGo){
  const s=mkScreen();
  s.appendChild(el('div','','<div style="font-size:2.6rem;text-align:center">🌙</div>'));
  s.appendChild(el('p','sub',title));
  const g=el('div','reveal-gate');
  g.appendChild(el('div','who',who));
  g.appendChild(el('p','sub','لا تدع أحداً غيرك ينظر إلى الشاشة'));
  g.appendChild(btn('اضغط للمتابعة سراً','',onGo));
  s.appendChild(g);
}
function startNightPhase(){
  S.nightQueue=shuffle(alive().map(p=>p.id));
  S.nightQueueIdx=0;
  S.nightKillTarget=null;
  S.nightProtectTarget=null;
  S.screen='nightGate';
}
function advanceNightQueue(){
  S.nightQueueIdx++;
  if(S.nightQueueIdx>=S.nightQueue.length) resolveNight();
  else S.screen='nightGate';
}
function screenNightGate(){
  const p=byId(S.nightQueue[S.nightQueueIdx]);
  passGate(`الليلة ${S.round} — دور`, p.name+' 🌙', ()=>{
    if(p.role==='امبوستر') S.screen='nightImpostorPick';
    else if(p.role==='طبيب') S.screen='nightDoctorPick';
    else if(p.role==='شايب') S.screen='nightDetectivePick';
    else S.screen='nightCitizen';
    render();
  });
}
function screenNightCitizen(){
  const s=mkScreen();
  s.appendChild(el('div','','<div style="font-size:2.6rem;text-align:center">🌘</div>'));
  s.appendChild(el('h2','','لا يوجد لديك أي إجراء الليلة'));
  s.appendChild(el('p','sub','أغلق عينيك وانتظر بهدوء حتى يحين الصباح'));
  s.appendChild(btn('حسناً، أخفِ الشاشة','',()=>{ advanceNightQueue(); render(); }));
}
function screenNightImpostorPick(){
  const imp=S.players.find(p=>p.role==='امبوستر');
  const s=mkScreen();
  s.appendChild(el('h2','','اختر ضحيتك الليلة'));
  const list=el('div','pick-list');
  alive().filter(p=>p.id!==imp.id).forEach(p=>{
    const it=el('div','pick-item'+(S.nightKillTarget===p.id?' sel':''), p.name);
    it.onclick=()=>{S.nightKillTarget=p.id; render();};
    list.appendChild(it);
  });
  s.appendChild(list);
  const ok=btn('تأكيد وإخفاء الشاشة','',()=>{ advanceNightQueue(); render(); });
  if(!S.nightKillTarget) ok.disabled=true;
  s.appendChild(ok);
}
function screenNightDoctorPick(){
  const s=mkScreen();
  s.appendChild(el('h2','','اختر من تحميه الليلة'));
  s.appendChild(el('p','sub','لا يمكنك حماية نفس الشخص جولتين متتاليتين'));
  const list=el('div','pick-list');
  alive().forEach(p=>{
    const blocked=(p.id===S.lastProtected);
    const it=el('div','pick-item'+(S.nightProtectTarget===p.id?' sel':'')+(blocked?' skip':''), p.name+(blocked?' (لا يمكن)':''));
    if(!blocked) it.onclick=()=>{S.nightProtectTarget=p.id; render();};
    list.appendChild(it);
  });
  s.appendChild(list);
  const ok=btn('تأكيد وإخفاء الشاشة','',()=>{ S.lastProtected=S.nightProtectTarget; advanceNightQueue(); render(); });
  if(!S.nightProtectTarget) ok.disabled=true;
  s.appendChild(ok);
}
function screenNightDetectivePick(){
  const det=S.players.find(p=>p.role==='شايب');
  const s=mkScreen();
  s.appendChild(el('h2','','اختر من تحقق معه'));
  const list=el('div','pick-list');
  alive().filter(p=>p.id!==det.id).forEach(p=>{
    const it=el('div','pick-item', p.name);
    it.onclick=()=>{
      S.detectiveTargetId=p.id;
      S.detectiveResult=(p.role==='امبوستر')?'خائن':'مسالم';
      S.screen='detectiveResult'; render();
    };
    list.appendChild(it);
  });
  s.appendChild(list);
}
function screenDetectiveResult(){
  const target=byId(S.detectiveTargetId);
  const s=mkScreen();
  s.appendChild(el('div','','<div style="font-size:2.6rem;text-align:center">📜</div>'));
  s.appendChild(el('h2','',target.name));
  const badge=el('div','result-badge '+(S.detectiveResult==='خائن'?'badge-traitor':'badge-peace'), S.detectiveResult);
  const wrap=el('div',''); wrap.style.textAlign='center'; wrap.appendChild(badge);
  s.appendChild(wrap);
  s.appendChild(btn('حسناً، أخفِ الشاشة','',()=>{ advanceNightQueue(); render(); }));
}
function resolveNight(){
  const target=byId(S.nightKillTarget);
  S.savedByDoctor = target && S.nightProtectTarget===target.id;
  if(target && !S.savedByDoctor){ target.alive=false; S.victimId=target.id; }
  else S.victimId=null;
  S.screen='victim';
}
function screenVictim(){
  if(S.victimId===null || S.victimId===undefined){
    const s=el('div','kill-screen');
    s.innerHTML=`<div style="font-size:3.6rem">🌅</div><div class="glitch" style="font-size:1.6rem">نجا الجميع الليلة الماضية</div><div style="color:#c9a9a9">تدخّل الطبيب في اللحظة الأخيرة...</div>`;
    const c=btn('متابعة إلى النقاش','',()=>{S.screen='discuss'; render();});
    c.style.maxWidth='320px'; s.appendChild(c);
    app.innerHTML=''; app.appendChild(s); addDrips(s);
    return;
  }
  const v=byId(S.victimId);
  const s=el('div','kill-screen flash');
  s.innerHTML=`<div class="skull">💀</div><div style="color:#c9a9a9">سقط ضحية الليلة الماضية...</div><div class="glitch">${v.name}</div>`;
  const c=btn('متابعة إلى النقاش','',()=>{ if(checkWinAndGo()) return; S.screen='discuss'; render();});
  c.style.maxWidth='320px'; s.appendChild(c);
  app.innerHTML=''; app.appendChild(s); addDrips(s);
}
function addDrips(container){
  for(let i=0;i<9;i++){
    const d=el('div','drip'); d.style.left=(5+i*11)+'%'; d.style.animationDuration=(2+Math.random()*2.5)+'s'; d.style.animationDelay=(Math.random()*1.5)+'s';
    container.appendChild(d);
  }
}
function screenDiscuss(){
  const s=mkScreen();
  s.appendChild(el('h2','',`نقاش الجولة ${S.round}`));
  s.appendChild(el('p','sub','ناقشوا من يبدو مريباً... الوقت يمضي'));
  const t=el('div','timer','03:00');
  s.appendChild(t);
  s.appendChild(btn('إنهاء النقاش والانتقال للتصويت','',()=>{clearInterval(S.timerHandle); startVoting();}));
  S.timerSec=180;
  clearInterval(S.timerHandle);
  S.timerHandle=setInterval(()=>{
    S.timerSec--;
    const m=String(Math.floor(S.timerSec/60)).padStart(2,'0'), sec=String(S.timerSec%60).padStart(2,'0');
    const tt=app.querySelector('.timer'); if(tt) tt.textContent=`${m}:${sec}`;
    if(S.timerSec<=0){ clearInterval(S.timerHandle); startVoting(); }
  },1000);
}
function startVoting(){
  S.voters=alive().map(p=>p.id);
  S.voteIdx=0; S.votes={}; S.skipVotes=0;
  S.screen='voteGate'; render();
}
function screenVoteGate(){
  if(S.voteIdx>=S.voters.length){ tallyVotes(); return; }
  const voter=byId(S.voters[S.voteIdx]);
  passGate('حان دور التصويت لـ', voter.name+' 🗳️', ()=>{S.screen='votePick'; render();});
}
function screenVotePick(){
  const voter=byId(S.voters[S.voteIdx]);
  const s=mkScreen();
  s.appendChild(el('h2','',`من يشك به ${voter.name}؟`));
  const list=el('div','pick-list');
  alive().filter(p=>p.id!==voter.id).forEach(p=>{
    const it=el('div','pick-item', p.name);
    it.onclick=()=>{ S.votes[p.id]=(S.votes[p.id]||0)+1; S.voteIdx++; S.screen='voteGate'; render(); };
    list.appendChild(it);
  });
  const skip=el('div','pick-item skip','تخطي');
  skip.onclick=()=>{ S.skipVotes++; S.voteIdx++; S.screen='voteGate'; render(); };
  list.appendChild(skip);
  s.appendChild(list);
}
function tallyVotes(){
  let max=S.skipVotes, leaders=['__skip__'];
  for(const id in S.votes){
    if(S.votes[id]>max){ max=S.votes[id]; leaders=[id]; }
    else if(S.votes[id]===max){ leaders.push(id); }
  }
  if(leaders.length>1 || leaders[0]==='__skip__'){
    S.eliminatedId=null;
  } else {
    S.eliminatedId=leaders[0];
    const p=byId(S.eliminatedId); p.alive=false;
    S.eliminatedWasImpostor=(p.role==='امبوستر');
  }
  S.screen='voteResult'; render();
}
function screenVoteResult(){
  if(!S.eliminatedId){
    const s=mkScreen();
    s.appendChild(el('div','','<div style="font-size:3rem;text-align:center">🤐</div>'));
    s.appendChild(el('h2','','لم يتفق أحد على أحد'));
    s.appendChild(el('p','sub','القرية منقسمة... لا أحد يُطرد هذه الجولة'));
    s.appendChild(btn('الجولة التالية →','',nextRound));
    return;
  }
  if(S.eliminatedWasImpostor){ S.screen='impReveal'; render(); return; }
  const p=byId(S.eliminatedId);
  const s=mkScreen();
  s.appendChild(el('div','','<div style="font-size:3rem;text-align:center">⚰️</div>'));
  s.appendChild(el('h2','',p.name+' طُرد من القرية'));
  const badge=el('div','result-badge badge-peace','كان مسالماً');
  const w=el('div',''); w.style.textAlign='center'; w.appendChild(badge); s.appendChild(w);
  s.appendChild(el('p','sub','لم يكن هو الامبوستر... استمر البحث'));
  s.appendChild(btn('الجولة التالية →','',()=>{ if(checkWinAndGo()) return; nextRound(); }));
}
function screenImpReveal(){
  const p=byId(S.eliminatedId);
  const s=el('div','imp-reveal');
  s.innerHTML=`<div class="imp-eye">👁️</div><div class="imp-title">${p.name} كان الامبوستر!</div><div style="color:#e6b8b8">انكشف أمره أخيراً...</div>`;
  const c=btn('فاز الشعب 🎉','gold',()=>{S.winner='citizens'; S.screen='gameOver'; render();});
  c.style.maxWidth='300px'; s.appendChild(c);
  app.innerHTML=''; app.appendChild(s);
}
function nextRound(){ S.round++; startNightPhase(); render(); }
function checkWinAndGo(){
  const a=alive();
  const impAlive=a.some(p=>p.role==='امبوستر');
  if(!impAlive){ S.winner='citizens'; S.screen='gameOver'; render(); return true; }
  if(a.length<=2){ S.winner='impostor'; S.screen='gameOver'; render(); return true; }
  return false;
}
function screenGameOver(){
  const s=mkScreen();
  s.appendChild(el('div','','<div style="font-size:3.2rem;text-align:center">'+(S.winner==='citizens'?'🎉':'🗡️')+'</div>'));
  s.appendChild(el('div','winner-banner '+(S.winner==='citizens'?'win-citizens':'win-impostor'), S.winner==='citizens'?'فاز الشعب!':'فاز الامبوستر!'));
  s.appendChild(el('h2','','كشف الأدوار'));
  const roster=el('div','roster');
  S.players.forEach(p=>{
    const row=el('div','roster-row'+(p.alive?'':' dead'));
    const tagClass=p.role==='امبوستر'?'tag-impostor':p.role==='طبيب'?'tag-doctor':p.role==='شايب'?'tag-detective':'tag-citizen';
    row.innerHTML=`<span>${p.name}</span><span class="role-tag ${tagClass}">${p.role}</span>`;
    roster.appendChild(row);
  });
  s.appendChild(roster);
  s.appendChild(btn('لعبة جديدة 🔄','',()=>{S=freshState(); render();}));
}
render();
</script>
</body>
</html>
